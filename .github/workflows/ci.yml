name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04  # ubuntu-latest 已到 26.04，缺 Python 3.9
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"

      # openjm 总仓已公开，冻结向量可以匿名拉；之前 conformance 用例在 CI 里一直是 skip 的
      - name: Checkout test vectors
        uses: actions/checkout@v4
        with:
          repository: qichen-sbgh/openjm
          path: openjm

      - run: python -m pytest -q
        env:
          OPENJM_TESTVECTORS: ${{ github.workspace }}/openjm/testvectors
