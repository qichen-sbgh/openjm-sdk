[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openjm"
version = "0.1.0"
description = "JM v1 encrypted document container — sender-side Python SDK"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
openjm = "openjm.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
